name: Link Checker

on:
  push:
    branches: [astro]
  pull_request:
    branches: [astro]
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Site
        run: npm run build
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          PLEX_SERVER_URL: ${{ secrets.PLEX_SERVER_URL }}
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
          PLEX_USERNAME: ${{ secrets.PLEX_USERNAME }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Link Checker
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          # Check the built files in dist
          # The action automatically picks up lychee.toml for config
          args: ./dist/**/*.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
