name: Link Checker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Site
        run: npm run build

      - name: Link Checker
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          # Check the built files in dist
          # The action automatically picks up lychee.toml for config
          args: ./dist/**/*.html
          fail: true
