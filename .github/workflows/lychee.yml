name: Link Checker

on:
  push:
    branches: [astro]
  pull_request:
    branches: [astro]
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Site from Cache
        run: cp src/data/cache/*.json src/data/ && npm run mvdata && npx astro build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Link Checker
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          # Check the built files in dist
          # The action automatically picks up lychee.toml for config
          args: ./dist/**/*.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
