# .github/workflows/rebuild.yml

name: Update Data Cache and Re-deploy Site

on:
  workflow_dispatch: # Allows manual triggering from GitHub UI
  schedule:
    # Run every 6 hours (4 times a day)
    - cron: '0 */6 * * *'

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Data
        run: npm run fetch
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          PLEX_SERVER_URL: ${{ secrets.PLEX_SERVER_URL }}
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
          PLEX_USERNAME: ${{ secrets.PLEX_USERNAME }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Commit and Push Cache
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          # Ensure directory exists to prevent git add failure if it wasn't created
          mkdir -p src/data/cache

          # Add all changes. This ensures that any files modified by the fetch process
          # (like package-lock.json or other data files outside src/data/cache) are staged.
          # This prevents 'git pull --rebase' from failing due to unstaged changes.
          git add .

          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update data cache"
            # Pull with rebase to handle concurrent updates to the repo.
            # The working tree is clean now because we staged and committed all changes.
            git pull --rebase
            git push
          fi
