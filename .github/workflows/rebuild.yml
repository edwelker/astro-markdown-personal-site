# .github/workflows/rebuild.yml

name: Update Data Cache and Re-deploy Site

on:
  workflow_dispatch: # Allows manual triggering from GitHub UI
  schedule:
    # Run every 6 hours (4 times a day)
    - cron: '0 */6 * * *'

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      secrets: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Fetch Data
        run: npm run fetch
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Rotate Trakt Refresh Token
        # After a successful token exchange Trakt returns a new refresh token.
        # Persist it back to GitHub Secrets so the next run uses a valid token.
        run: |
          if [ -f /tmp/trakt-new-refresh-token.txt ]; then
            NEW_TOKEN=$(cat /tmp/trakt-new-refresh-token.txt)
            gh secret set TRAKT_REFRESH_TOKEN --body "$NEW_TOKEN"
            echo "✅ TRAKT_REFRESH_TOKEN rotated"
          else
            echo "ℹ️  No new refresh token written (TRAKT_ACCESS_TOKEN mode or fetch skipped)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Cache
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          # Ensure directory exists to prevent git add failure if it wasn't created
          mkdir -p src/data/cache

          # Add all changes. This ensures that any files modified by the fetch process
          # (like package-lock.json or other data files outside src/data/cache) are staged.
          # This prevents 'git pull --rebase' from failing due to unstaged changes.
          git add .

          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update data cache"
            # Pull with rebase to handle concurrent updates to the repo.
            # The working tree is clean now because we staged and committed all changes.
            git pull --rebase
            git push
          fi
