name: CI

on:
  push:
    branches: [astro]
  pull_request:
    branches: [astro]

jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Hydrate src/data/*.json from committed cache so astro check can resolve data imports
      - name: Hydrate Data from Cache
        run: cp src/data/cache/*.json src/data/

      # Typecheck Astro & TypeScript
      - name: Run Astro Check
        run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      # Run Knip. If it fails, we log it but don't stop the build.
      - name: Run Knip (Unused Code Check)
        run: npm run knip
        continue-on-error: true

      # Run Tests with coverage for Codecov
      - name: Run Tests
        run: npm run test:cov
        env:
          TZ: 'America/New_York'

      # Upload coverage to Codecov (Requires CODECOV_TOKEN in repository secrets)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

      # Upload the coverage folder so you can download it from GitHub Actions summary
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # Build site and run browser smoke tests (skipped automatically on Cloudflare)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build & Run Smoke Tests
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          TZ: 'America/New_York'
