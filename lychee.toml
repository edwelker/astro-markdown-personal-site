# Lychee Configuration

# Check local files relative to this directory
root_dir = "./dist"

# Ignore SSL errors (e.g. bassibikes.com)
insecure = true

# Hide progress bar (cleaner logs)
no_progress = true

# Accept status codes (including rate limiting and anti-bot responses)
accept = ["100..=103", "200..=299", "403", "429"]

# Exclude specific domains or patterns
exclude = [
    "trakt\\.tv",
    "gnu\\.org",
    "oxo\\.com",
    "onntv\\.com",
    "mama\\.indstate\\.edu",
    "linkedin\\.com",
    "/sports",
    "bsomusic\\.org",
    "dash\\.cloudflare\\.com",
    "last\\.fm",
    "instagram\\.com",
]
